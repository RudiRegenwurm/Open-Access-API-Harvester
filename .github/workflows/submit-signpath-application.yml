name: Submit SignPath Foundation application

on:
  push:
    branches:
      - ops/signpath-application-20260921
    paths:
      - .github/workflows/submit-signpath-application.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Selenium
        run: python -m pip install selenium

      - name: Submit regular SignPath Foundation application
        run: python ops/signpath_submit_application.py

      - name: Upload submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signpath-application-evidence
          path: |
            signpath-application-result.json
            signpath-application-confirmation.png
          if-no-files-found: warn
