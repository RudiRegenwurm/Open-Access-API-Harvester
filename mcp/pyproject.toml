[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notanda-mcp"
version = "0.1.0"
description = "Experimental local MCP server for provenance-aware Notanda literature retrieval."
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "notanda==1.3.1",
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
notanda-mcp = "notanda_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
