name: Inspect SignPath application form

on:
  push:
    branches:
      - ops/signpath-application-20260921
    paths:
      - .github/workflows/inspect-signpath-form.yml
      - ops/signpath_inspect_form.py

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Selenium
        run: python -m pip install selenium

      - name: Inspect live SignPath application form in Chrome
        run: python ops/signpath_inspect_form.py

      - name: Upload form controls
        uses: actions/upload-artifact@v4
        with:
          name: signpath-public-form-controls
          path: signpath-form-controls.json
          if-no-files-found: error
