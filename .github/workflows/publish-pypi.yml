name: Publish Notanda to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:
    if: github.event.head_commit.message == 'ci: publish notanda to PyPI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_TOKEN_VALUE: ${{ secrets.PYPI_API_TOKEN != '' && secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish with API token
        if: env.PYPI_TOKEN_VALUE != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_TOKEN_VALUE }}

      - name: Publish with PyPI Trusted Publishing
        if: env.PYPI_TOKEN_VALUE == ''
        uses: pypa/gh-action-pypi-publish@release/v1
