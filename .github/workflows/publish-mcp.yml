name: Publish Notanda MCP Beta

on:
  # Dedicated publication branch: no main merge or product release is required.
  push:
    branches: [feature/mcp-registry-beta-20260925]
    paths: ["mcp/**", ".github/workflows/publish-mcp.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notanda-mcp-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check package
        run: |
          python -m pip install build twine pytest jsonschema
          python -m build mcp
          python -m twine check --strict mcp/dist/*
          python -m pip install mcp/dist/*.whl
          python -m pip check
          python -m pytest mcp/tests -q
          notanda-mcp --help
      - name: Install verified MCP publisher
        run: |
          curl --fail --location --retry 3 -o publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher validate --file mcp/server.json
      - uses: actions/upload-artifact@v4
        with:
          name: notanda-mcp-distributions
          path: mcp/dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: notanda_mcp_env
      url: https://pypi.org/project/notanda-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notanda-mcp-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: notanda_mcp_env
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified MCP publisher
        run: |
          curl --fail --location --retry 3 -o publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Publish Beta manifest with GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp/server.json
