name: Publish Notanda to PyPI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish with repository token
        if: env.PYPI_API_TOKEN != '' || env.PYPI_TOKEN != ''
        run: |
          python -m pip install --upgrade twine
          TOKEN="$PYPI_API_TOKEN"
          if [ -z "$TOKEN" ]; then TOKEN="$PYPI_TOKEN"; fi
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$TOKEN" python -m twine upload dist/*
      - name: Publish with PyPI Trusted Publishing
        if: env.PYPI_API_TOKEN == '' && env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
